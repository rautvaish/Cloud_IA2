apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 80          # port exposed by the Service inside the cluster
      targetPort: 5000  # port the container listens on
      nodePort: 30007   # port exposed on the node (30000-32767)
